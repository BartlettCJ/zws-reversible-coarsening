[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zws-reversible-null-phase"
version = "0.4.0"
description = "Censored first-passage and low-density nucleation study of the frozen ZWS reversible null-phase rule"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chris Bartlett"}]
license = {text = "MIT"}
dependencies = [
  "torch>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
zws-null-phase = "zws_reversible_null_phase.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the release's correctness-oriented baseline stable across Ruff updates.
select = ["E4", "E7", "E9", "F"]
